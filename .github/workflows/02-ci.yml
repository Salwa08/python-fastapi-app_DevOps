
name: CI

on: [push]

env:
  APP_NAME: fastapi-starter

jobs:
  lint:
    name: Lint - Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Installer les dépendances
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Vérifier le style
        run: ruff check .


      - name: Afficher les contextes GitHub
        run: |
          echo "Application : ${{ env.APP_NAME }}"
          echo "Acteur : ${{ github.actor }}"
          echo "Événement : ${{ github.event_name }}"
          echo "Branche : ${{ github.ref_name }}"
          echo "SHA : ${{ github.sha }}"
          echo "OS : ${{ runner.os }}"
          echo "Head ref : ${{ github.head_ref }}"
          echo "Base ref : ${{ github.base_ref }}"


      - name: Afficher le contexte GitHub JSON
        run: echo '${{ toJson(github) }}'

        
  build:
    name: Build - Vérifier l'application
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Installer les dépendances
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Compiler le code
        run: python -m compileall app

      - name: Importer l'application
        run: python -c "from app.main import app; print(app.title)"

  test:
    name: Test - Pytest
    needs: [lint, build]
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Installer les dépendances
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Exécuter les tests
        run: pytest
