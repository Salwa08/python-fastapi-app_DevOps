name: Env, Inputs and Outputs Lab

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environnement cible
        required: true
        type: choice
        options: [dev, staging, prod]
      version:
        description: Version à déployer
        type: string
        default: '1.0.0'
      debug:
        description: Afficher les informations de débogage
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      full_version: ${{ steps.version.outputs.full_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set environment variables
        run: |
          echo "APP_NAME=my-app" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date +%F)" >> "$GITHUB_ENV"

      - name: Print environment variables
        run: echo "Application $APP_NAME built on $BUILD_DATE"

      - name: Print deployment inputs
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          VERSION: ${{ inputs.version }}
        run: |
          echo "Environment: $TARGET_ENVIRONMENT"
          echo "Version: $VERSION"

      - name: Print debug information
        if: ${{ inputs.debug }}
        env:
          COMMIT_SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
          RUNNER_OS: ${{ runner.os }}
        run: |
          echo "Debug mode enabled"
          echo "Commit: $COMMIT_SHA"
          echo "Branch: $BRANCH_NAME"
          echo "Runner OS: $RUNNER_OS"

      - name: Compute full version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          full_version="$VERSION-$(date +%F)"
          echo "full_version=$full_version" >> "$GITHUB_OUTPUT"
          echo "Full version: $full_version"

  verify-env:
    runs-on: ubuntu-latest
    steps:
      - name: Print APP_NAME
        run: echo "APP_NAME in another job is '${APP_NAME:-}'"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Show deployment target
        env:
          FULL_VERSION: ${{ needs.build.outputs.full_version }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: echo "Deploying $FULL_VERSION to $TARGET_ENVIRONMENT"
