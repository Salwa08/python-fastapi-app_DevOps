name: Build Info
description: Print build details and return a build id

inputs:
  app-name:
    description: Application name
    required: true
  version:
    description: Application version
    default: '1.0.0'

outputs:
  build-id:
    description: Generated build identifier
    value: ${{ steps.make-id.outputs.build-id }}

runs:
  using: composite
  steps:
    - name: Print build details
      shell: bash
      env:
        APP_NAME: ${{ inputs.app-name }}
        APP_VERSION: ${{ inputs.version }}
      run: printf 'Building %s v%s\n' "$APP_NAME" "$APP_VERSION"

    - name: Generate build id
      id: make-id
      shell: bash
      env:
        APP_NAME: ${{ inputs.app-name }}
        APP_VERSION: ${{ inputs.version }}
      run: printf 'build-id=%s-%s\n' "$APP_NAME" "$APP_VERSION" >> "$GITHUB_OUTPUT"
